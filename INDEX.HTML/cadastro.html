<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro</title>

  <!-- CSS minimalista -->
  <link rel="stylesheet" href="css/cadastro.css" />
  <link rel="icon" href="imagem/favicon.ico" type="image/x-icon">
</head>

<body>

  <header class="header">
    <a class="logo" href="indexfoundmanga.html">
      <img src="imagem/LOGO.PP.jpeg" alt="Logo">
    </a>

    <a href="login.html" class="btn-login">Login</a>
  </header>

  <section class="container">
    <form id="cadastroForm" class="form" onsubmit="validarCadastro(event)">
      <h1>Crie sua conta</h1>
      <p class="subtitle">Preencha os dados abaixo para continuar</p>

      <div id="mensagem" class="error"></div>

      <div class="input-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" name="nome" required maxlength="80">
      </div>

      <div class="row">
        <div class="input-group">
          <label>Data de Nascimento</label>
          <input type="date" id="nascimento" name="nascimento">
        </div>

        <div class="input-group">
          <label>Gênero</label>
          <select id="sexo" name="sexo">
            <option value="">Selecione</option>
            <option>Masculino</option>
            <option>Feminino</option>
            <option>Outro</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label>Nome Materno</label>
        <input type="text" id="nomeMaterno" maxlength="80">
      </div>

      <div class="input-group">
        <label>CPF</label>
        <input type="text" id="cpf" maxlength="14">
      </div>

      <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="email">
      </div>

      <div class="row">
        <div class="input-group">
          <label>Celular</label>
          <input type="text" id="celular">
        </div>

        <div class="input-group">
          <label>Telefone Fixo</label>
          <input type="text" id="fixo">
        </div>
      </div>

      <div class="row">
        <div class="input-group">
          <label>CEP</label>
          <input type="text" id="cep" maxlength="9">
        </div>

        <div class="input-group">
          <label>Cidade</label>
          <input type="text" id="cidade">
        </div>

        <div class="input-group">
          <label>Estado</label>
          <input type="text" id="estado">
        </div>
      </div>

      <div class="input-group">
        <label>Endereço</label>
        <input type="text" id="endereco">
      </div>

      <div class="input-group">
        <label>Login</label>
        <input type="text" id="login" minlength="6" maxlength="15">
      </div>

      <div class="row">
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="senha">
        </div>

        <div class="input-group">
          <label>Confirmar Senha</label>
          <input type="password" id="confirmarSenha">
        </div>
      </div>

      <button type="submit" class="btn-submit">Cadastrar</button>
      <button type="reset" class="btn-reset">Limpar</button>
    </form>
  </section>

  <footer class="footer">
    <p>© <span id="anoAtual"></span> Portal das Páginas</p>
  </footer>

  <!-- Máscaras -->
  <script src="https://cdn.jsdelivr.net/npm/inputmask/dist/inputmask.min.js"></script>

  <!-- JS minimalista -->
  <script src="JavaScript/cadastro.js"></script>

</body>
</html>
